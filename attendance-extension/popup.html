<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HRMS Attendance Extractor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="popup-wrapper">

    <!-- ── Header ───────────────────────────────────────────── -->
    <header class="popup-header">
      <div class="popup-title">
        <span class="popup-icon">📊</span>
        <div>
          <h1>Attendance Extractor</h1>
          <p class="popup-subtitle">HRMS → Work Hours Tracker</p>
        </div>
      </div>
      <div class="header-badge" id="status-badge">Ready</div>
    </header>

    <!-- ── Action Buttons ───────────────────────────────────── -->
    <div class="action-bar">
      <button id="btn-fetch" class="btn btn-primary btn-full">
        <span class="btn-icon-left">🔍</span>
        Fetch Attendance
      </button>
    </div>

    <!-- ── Status Message ───────────────────────────────────── -->
    <div id="status-area" class="status-area hidden">
      <div id="status-icon" class="status-icon">⏳</div>
      <div id="status-text" class="status-text">Extracting data...</div>
    </div>

    <!-- ── Month Boundary Notice ────────────────────────────── -->
    <div id="month-notice" class="month-notice hidden">
      <span class="month-notice-icon">📅</span>
      <span id="month-notice-text" class="month-notice-text"></span>
    </div>

    <!-- ── Data Preview ─────────────────────────────────────── -->
    <div id="preview-section" class="preview-section hidden">
      <div class="preview-header">
        <h2 class="section-label">Extracted Data</h2>
        <span id="week-indicator" class="week-indicator"></span>
      </div>

      <div id="days-preview" class="days-preview"></div>

      <!-- Missing days -->
      <div id="missing-days" class="missing-days hidden">
        <span class="missing-icon">⚠️</span>
        <span id="missing-text" class="missing-text"></span>
      </div>

      <!-- Meta info -->
      <div id="meta-info" class="meta-info hidden">
        <span id="meta-text" class="meta-text"></span>
      </div>
    </div>

    <!-- ── Weekly Summary ───────────────────────────────────── -->
    <div id="summary-section" class="summary-section hidden">
      <div class="section-label">Weekly Summary</div>

      <div class="summary-grid">
        <div class="summary-stat">
          <div class="summary-stat-label">Worked</div>
          <div id="summary-worked" class="summary-stat-value worked">00:00</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">Required</div>
          <div id="summary-required" class="summary-stat-value required">00:00</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">Remaining</div>
          <div id="summary-remaining" class="summary-stat-value remaining">00:00</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">Days</div>
          <div id="summary-days" class="summary-stat-value days">0/0</div>
        </div>
      </div>

      <div class="summary-progress">
        <div class="summary-progress-labels">
          <span id="summary-pct" class="summary-pct">0%</span>
          <span class="summary-pct-target">Target</span>
        </div>
        <div class="summary-progress-track">
          <div id="summary-bar-fill" class="summary-bar-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- ── Today's Logout Time ──────────────────────────────── -->
    <div id="logout-section" class="logout-section hidden">
      <div class="logout-card">
        <div class="logout-card-header">
          <span class="logout-card-icon" id="logout-icon">🕐</span>
          <div class="logout-card-label" id="logout-label">Today's Logout</div>
        </div>
        <div class="logout-card-time" id="logout-time">--:--</div>
        <div class="logout-card-detail" id="logout-detail">
          <span class="logout-meta" id="logout-login-info">Login: --:--</span>
          <span class="logout-separator">·</span>
          <span class="logout-meta" id="logout-remaining-info">Remaining: --:--</span>
        </div>
      </div>
    </div>

    <!-- ── Action Buttons (after data) ──────────────────────── -->
    <div id="post-actions" class="action-bar post-actions hidden">
      <button id="btn-send" class="btn btn-accent btn-full">
        <span class="btn-icon-left">🚀</span>
        Send to Tracker
      </button>
      <div class="action-row">
        <button id="btn-copy" class="btn btn-ghost btn-half">
          <span class="btn-icon-left">📋</span>
          Copy JSON
        </button>
        <button id="btn-clear" class="btn btn-ghost-danger btn-half">
          <span class="btn-icon-left">🗑️</span>
          Clear
        </button>
      </div>
    </div>

    <!-- ── Send Result ──────────────────────────────────────── -->
    <div id="send-result" class="send-result hidden">
      <div id="send-icon" class="send-icon">✅</div>
      <div id="send-text" class="send-text">Data sent successfully!</div>
    </div>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <footer class="popup-footer">
      <a href="https://wht.crypticani.dev" target="_blank" rel="noopener">Open Tracker</a>
      <span class="footer-dot">·</span>
      <span>v1.3.0</span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
